name: Publish

on:
  create:
    tags:
      - '*'

jobs:
  Build-And-Publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build and publish to pypi
        uses: JRubics/poetry-publish@v2.1
        with:
          python_version: "3.12"
          pypi_token: ${{ secrets.PYPI_TOKEN }}
