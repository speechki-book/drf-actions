[tool.poetry]
name = "drf-actions"
version = "0.5.0"
description = "Event journal for Django models powered by native PostgreSQL triggers, with a read-only DRF API"
authors = [
    "Pavel Maltsev <pavel@speechki.org>",
    "Bulat Kurbanov <kurbanovbul@gmail.com>",
]
maintainers = ["Bulat Kurbanov <kurbanovbul@gmail.com>"]
readme = "README.md"
homepage = "https://github.com/speechki-book/drf-actions"
repository = "https://github.com/speechki-book/drf-actions"
license = "MIT"
keywords = ["django", "restframework", "drf", "events", "log", "audit", "triggers", "postgresql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
exclude = ["tests*"]

[tool.poetry.urls]
"Issue Tracker" = "https://github.com/speechki-book/drf-actions/issues"
"Changelog" = "https://github.com/speechki-book/drf-actions/releases"

[tool.poetry.dependencies]
python = "^3.10"
Django = ">=4.2,<6.0"
djangorestframework = ">=3.16"
django-model-utils = ">=5.0.0"
django-filter = ">=24.3"
djangorestframework-api-key = ">=3.1.0"
django-json-widget = ">=2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-django = ">=4.8"
psycopg = {version = ">=3.2", extras = ["binary"]}

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.flake8]
ignore = [
    # Too many leading '#' for block comment ( https://www.flake8rules.com/rules/E266.html )
    "E266",
    # Whitespace before ':' ( https://www.flake8rules.com/rules/E203.html )
    "E203",
    # Line break occurred before a binary operator ( https://www.flake8rules.com/rules/W503.html )
    "W503"
]
max-line-length = 119
max-complexity = 15
select = "B,C,E,F,W,T4,B9"
exclude = [
    # No need to traverse our git directory
    ".git",
    # There's no value in checking cache directories
    "__pycache__",
    # The old directory contains Flake8 2.0
    "old",
    # This contains our built documentation
    "build",
    # This contains builds of flake8 that we don't want to check
    "dist",
    # django migrations
    "migrations"
]
# Module imported but unused ( https://www.flake8rules.com/rules/F401.html )
per-file-ignores = [
  # Tests
  "test_*.py:E501",
  "tests.py:E501",
]

[tool.isort]
profile = "black"
line_length = 119
only_sections = true
force_sort_within_sections = true
lines_after_imports = 2
lexicographical = true
sections = ["FUTURE", "STDLIB", "BASEFRAMEWORK", "FRAMEWORKEXT", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_baseframework = ["django"]
known_frameworkext = ["rest_framework"]
src_paths = ["drf_actions"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
